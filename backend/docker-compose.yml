version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - GIN_MODE=release
      - DB_USER=root
      - DB_PASSWORD=secretpassword
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=order_system_db
      - ORDER_ACCESS_SECRET=${ORDER_ACCESS_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secretpassword
      - MYSQL_DATABASE=order_system_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecretpassword"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
