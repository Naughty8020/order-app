services:
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test-only-password
      MYSQL_ROOT_HOST: '%'
    ports:
      - '127.0.0.1:13306:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-ptest-only-password']
      interval: 2s
      timeout: 5s
      retries: 60
