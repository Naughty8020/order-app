name: Integration and E2E

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_MYSQL_DSN: 'root:test-only-password@tcp(127.0.0.1:13306)/?parseTime=true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API and MySQL integration tests
        working-directory: backend
        run: go test -tags=integration ./... -count=1
      - name: Vet integration code
        working-directory: backend
        run: go vet -tags=integration ./...
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bunx playwright install --with-deps chromium
        working-directory: frontend
      - run: bun run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
