name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.11"
          cache-dependency-path: backend/go.sum

      - run: go mod download

      - run: go test ./...

      - run: go vet ./...

      - run: go build ./...